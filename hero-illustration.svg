<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-label="Illustration of a singer-songwriter with a guitar standing among Vermont pine trees at dusk">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b8f71"/>
      <stop offset="100%" stop-color="#3b5d42"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="320" fill="url(#sky)"/>

  <circle cx="640" cy="80" r="46" fill="#fdfdfa" opacity="0.85"/>

  <!-- distant tree line -->
  <g fill="#2c4832" opacity="0.55">
    <polygon points="40,260 70,190 100,260"/>
    <polygon points="90,260 130,170 170,260"/>
    <polygon points="160,260 195,200 230,260"/>
    <polygon points="560,260 600,180 640,260"/>
    <polygon points="620,260 655,195 690,260"/>
    <polygon points="680,260 720,175 760,260"/>
  </g>

  <!-- foreground pines -->
  <g fill="#22381f">
    <polygon points="90,270 130,150 170,270"/>
    <polygon points="115,270 130,220 145,270"/>
    <polygon points="620,270 665,140 710,270"/>
    <polygon points="645,270 665,205 685,270"/>
    <polygon points="10,270 45,175 80,270"/>
    <polygon points="700,270 738,190 776,270"/>
  </g>

  <!-- ground -->
  <rect x="0" y="266" width="800" height="54" fill="#1c2e1a"/>

  <!-- figure with guitar -->
  <g transform="translate(340,110)" fill="#16241a">
    <!-- head -->
    <circle cx="60" cy="18" r="17"/>
    <!-- beanie -->
    <path d="M43 12 a17 12 0 0 1 34 0 z"/>
    <!-- body -->
    <path d="M45 34 q15 -8 30 0 l8 90 q-23 12 -46 0 z"/>
    <!-- guitar body -->
    <ellipse cx="52" cy="120" rx="30" ry="38"/>
    <ellipse cx="52" cy="120" rx="12" ry="16" fill="#16241a" stroke="#3b5d42" stroke-width="2"/>
    <!-- guitar neck -->
    <rect x="70" y="55" width="8" height="65" transform="rotate(18 70 55)"/>
    <!-- arms -->
    <path d="M46 45 q-18 20 -10 45 l10 4 q0 -30 12 -42 z"/>
    <path d="M78 45 q16 14 14 40 l-9 3 q-2 -26 -14 -36 z"/>
  </g>

  <!-- fireflies -->
  <g fill="#f4d58d" opacity="0.8">
    <circle cx="230" cy="120" r="2.5"/>
    <circle cx="500" cy="150" r="2"/>
    <circle cx="470" cy="90" r="2.5"/>
    <circle cx="260" cy="180" r="2"/>
  </g>
</svg>
